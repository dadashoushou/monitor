<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMonitor 管理台</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #1a1a1a; }
  .header { background: #fff; border-bottom: 1px solid #e5e5e5; padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header-brand { display: flex; align-items: baseline; gap: 10px; min-width: 180px; }
  .header-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .header-primary { margin-left: auto; justify-content: flex-end; }
  .header-secondary { width: 100%; padding-top: 8px; border-top: 1px solid #f0f0f0; }
  .btn { min-height: 38px; min-width: 108px; padding: 7px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; transition: opacity .15s, background-color .15s, border-color .15s; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: #1a1a1a; color: #fff; }
  .btn-secondary { background: #fff; color: #1a1a1a; border: 1px solid #d4d4d4; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-warning { background: #f59e0b; color: #fff; }
  .btn-ai { background: #7c3aed; color: #fff; }
  .btn-sm { min-height: 34px; min-width: 82px; padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .main { max-width: 1760px; margin: 24px auto; padding: 0 24px; }
  .card { background: #fff; border-radius: 8px; border: 1px solid #e5e5e5; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #fafafa; padding: 10px 14px; text-align: left; font-weight: 500; color: #666; border-bottom: 1px solid #e5e5e5; white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
  .badge-rss { background: #dcfce7; color: #16a34a; }
  .badge-no_rss { background: #fef9c3; color: #a16207; }
  .badge-pending { background: #f3f4f6; color: #6b7280; }
  .badge-timeout { background: #fee2e2; color: #dc2626; }
  .badge-error { background: #fee2e2; color: #dc2626; }
  .badge-checking { background: #dbeafe; color: #2563eb; }
  .badge-crawling { background: #dbeafe; color: #2563eb; }
  .badge-auto { background: #f3f4f6; color: #6b7280; }
  .badge-html { background: #dbeafe; color: #2563eb; }
  .badge-js { background: #ede9fe; color: #7c3aed; }
  .badge-stealth { background: #ffedd5; color: #c2410c; }
  .badge-paused { background: #fee2e2; color: #dc2626; }
  .url-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .url-cell a { color: #2563eb; text-decoration: none; }
  .url-cell a:hover { text-decoration: underline; }
  .mode-stack { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .actions { display: grid; grid-template-columns: repeat(5, minmax(90px, 1fr)); gap: 8px; white-space: nowrap; }
  .actions-stack { display: flex; flex-direction: column; gap: 8px; min-width: 420px; }
  .actions .btn { width: 100%; }
  .actions-primary .btn { border-color: #d4d4d4; }
  .actions-secondary .btn-sm { opacity: .92; }
  .action-placeholder { visibility: hidden; pointer-events: none; }
  .status-bar { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: #555; }
  .dashboard-grid { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; align-items: start; }
  .stats-card { padding: 18px; }
  .stats-card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #222; }
  .stats-list { display: grid; gap: 14px; }
  .stats-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .stats-label-card { font-size: 13px; color: #666; }
  .stats-value-card { font-size: 28px; line-height: 1; font-weight: 700; color: #111; font-variant-numeric: tabular-nums; }
  .stats-note { margin-top: 18px; font-size: 12px; color: #888; line-height: 1.5; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
  .status-dot.busy { background: #3b82f6; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .status-meta { display: flex; align-items: baseline; gap: 10px; flex: 1; min-width: 0; }
  .status-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #999; }
  .status-value { color: #222; font-weight: 600; }
  .status-target { color: #666; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-progress { height: 3px; background: #e5e5e5; border-radius: 2px; overflow: hidden; width: 140px; display: none; }
  .status-progress.active { display: block; }
  .status-fill { height: 100%; background: #1a1a1a; transition: width .3s; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 100; }
  .overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 10px; padding: 24px; width: 460px; max-width: 95vw; }
  .modal h2 { font-size: 15px; font-weight: 600; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: #555; margin-bottom: 5px; }
  .field input, .field textarea, .field select { width: 100%; padding: 8px 10px; border: 1px solid #d4d4d4; border-radius: 6px; font-size: 13px; outline: none; background: #fff; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: #1a1a1a; }
  .field textarea { resize: vertical; min-height: 60px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .empty { text-align: center; padding: 48px; color: #999; font-size: 13px; }
  select.interval-select { min-height: 38px; padding: 6px 10px; border-radius: 8px; border: 1px solid #d4d4d4; font-size: 13px; cursor: pointer; background: #fff; }
  .history-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, .2); display: none; z-index: 90; }
  .history-backdrop.open { display: block; }
  .history-drawer { position: fixed; top: 0; right: 0; width: 420px; max-width: 92vw; height: 100vh; background: #fff; border-left: 1px solid #e5e5e5; box-shadow: -18px 0 40px rgba(15, 23, 42, .12); transform: translateX(100%); transition: transform .2s ease; z-index: 95; display: flex; flex-direction: column; }
  .history-drawer.open { transform: translateX(0); }
  .history-drawer-header { padding: 16px 18px 12px; display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #f0f0f0; }
  .history-panel h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: #555; }
  .history-list { list-style: none; }
  .history-list li { padding: 8px 14px; border-bottom: 1px solid #f0f0f0; font-size: 12px; cursor: pointer; display: flex; gap: 12px; align-items: center; }
  .history-list li:hover { background: #fafafa; }
  .history-list li:last-child { border-bottom: none; }
  .article-list { padding: 8px 14px 14px; background: #fafafa; }
  .article-list a { color: #2563eb; text-decoration: none; }
  .article-list a:hover { text-decoration: underline; }
  .article-item { padding: 9px 0; border-bottom: 1px solid #eee; }
  .article-item:last-child { border-bottom: none; }
  .article-title { display: block; font-size: 12px; line-height: 1.45; font-weight: 600; }
  .article-meta { margin-top: 4px; font-size: 11px; color: #999; }
  .article-content { margin-top: 6px; font-size: 12px; line-height: 1.6; color: #555; white-space: pre-wrap; word-break: break-word; }
  .data-dir-input { min-height: 38px; padding: 6px 10px; border-radius: 8px; border: 1px solid #d4d4d4; font-size: 13px; width: 260px; outline: none; }
  .data-dir-input:focus { border-color: #1a1a1a; }
  .data-dir-input.saved { border-color: #16a34a; }
  .data-dir-input.error { border-color: #ef4444; }
  .selectors-preview { margin-top: 14px; padding: 10px; background: #f9fafb; border: 1px solid #e5e5e5; border-radius: 6px; font-size: 11px; font-family: monospace; white-space: pre-wrap; max-height: 160px; overflow-y: auto; display: none; }
  .selectors-preview.active { display: block; }
  @media (max-width: 980px) {
    .main { padding: 0 16px; }
    .header { padding: 12px 16px; }
    .dashboard-grid { grid-template-columns: 1fr; }
    .header-primary { margin-left: 0; width: 100%; justify-content: flex-start; }
    .actions-stack { min-width: 0; }
    .actions { grid-template-columns: repeat(2, minmax(82px, 1fr)); }
    table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <h1>OpenMonitor</h1>
    <span id="siteCount" style="font-size:12px;color:#999;"></span>
  </div>
  <div class="header-group header-primary">
    <button class="btn btn-primary" id="btnServiceToggle">启动</button>
    <button class="btn btn-secondary" id="btnCheckAll">全部检测</button>
    <button class="btn btn-secondary" id="btnCrawlAll">全部抓取</button>
  </div>
  <div class="header-group header-secondary">
    <select class="interval-select" id="intervalSelect" title="定时抓取间隔">
      <option value="1" selected>每 1 小时</option>
      <option value="2">每 2 小时</option>
      <option value="3">每 3 小时</option>
      <option value="4">每 4 小时</option>
      <option value="5">每 5 小时</option>
      <option value="6">每 6 小时</option>
      <option value="7">每 7 小时</option>
      <option value="8">每 8 小时</option>
      <option value="9">每 9 小时</option>
      <option value="10">每 10 小时</option>
      <option value="11">每 11 小时</option>
      <option value="12">每 12 小时</option>
    </select>
    <select class="interval-select" id="ageSelect" title="文章时效过滤">
      <option value="0">不过滤</option>
      <option value="1">1 天内</option>
      <option value="2">2 天内</option>
      <option value="3">3 天内</option>
      <option value="5">5 天内</option>
      <option value="7">7 天内</option>
    </select>
    <input id="dataDirInput" class="data-dir-input" type="text" placeholder="数据目录（绝对路径，留空使用默认）" title="抓取结果 JSON 文件保存目录">
    <button class="btn btn-secondary" id="btnSaveDataDir">保存路径</button>
    <input id="bookmarkHtmlInput" class="data-dir-input" type="text" placeholder="书签 HTML 路径" title="本地书签导入文件">
    <button class="btn btn-secondary" id="btnImportBookmarks">导入书签</button>
    <button class="btn btn-primary" onclick="openModal()">+ 添加网站</button>
  </div>
</div>

<div class="main">
  <div class="dashboard-grid">
    <div class="card stats-card">
      <h2>统计</h2>
      <div class="stats-list">
        <div class="stats-row">
          <span class="stats-label-card">当月抓取条目：</span>
          <strong class="stats-value-card" id="statsMonthCount">0</strong>
        </div>
        <div class="stats-row">
          <span class="stats-label-card">本周抓取条目：</span>
          <strong class="stats-value-card" id="statsWeekCount">0</strong>
        </div>
        <div class="stats-row">
          <span class="stats-label-card">本日抓取条目：</span>
          <strong class="stats-value-card" id="statsDayCount">0</strong>
        </div>
      </div>
      <p class="stats-note">按镜像历史快照日期计入当月、本周和本日</p>
    </div>
    <div class="status-bar" id="statusBar">
    <span class="status-dot" id="statusDot"></span>
    <div class="status-meta">
      <span class="status-label">状态</span>
      <span class="status-value" id="statusTask">就绪</span>
      <span class="status-target" id="statusTarget">等待操作</span>
    </div>
    <div class="status-progress" id="statusProgress"><div class="status-fill" id="statusFill"></div></div>
    </div>
  </div>
  <div class="card">
    <table id="siteTable">
      <thead>
        <tr>
          <th>序号</th>
          <th>名称</th>
          <th>URL</th>
          <th>RSS 地址</th>
          <th>状态</th>
          <th>抓取模式</th>
          <th>最后检测</th>
          <th>最近条目数</th>
          <th>上次抓取</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="history-backdrop" id="historyBackdrop" onclick="closeHistoryDrawer()"></div>
<aside class="history-drawer history-panel" id="historyDrawer">
  <div class="history-drawer-header">
    <h3 id="historyTitle">抓取历史</h3>
    <button class="btn btn-secondary btn-sm" onclick="closeHistoryDrawer()">关闭</button>
  </div>
  <ul class="history-list" id="historyList"></ul>
  <div class="article-list" id="articleList" style="display:none"></div>
</aside>

<div class="overlay" id="overlay" onpointerdown="trackModalBackdropPointerDown(event)" onclick="closeModalOnBg(event)">
  <div class="modal">
    <h2 id="modalTitle">添加网站</h2>
    <div class="field"><label>名称 *</label><input id="fName" placeholder="例如：新华网"></div>
    <div class="field"><label>URL *</label><input id="fUrl" placeholder="https://example.com"></div>
    <div class="field">
      <label>抓取模式</label>
      <select id="fCrawlMode">
        <option value="auto">auto - 自动（默认）</option>
        <option value="html">html - 静态抓取</option>
        <option value="js">js - 动态渲染</option>
        <option value="stealth">stealth - 隐蔽抓取</option>
      </select>
    </div>
    <div class="field">
      <label>详情页抓取模式</label>
      <select id="fArticleCrawlMode">
        <option value="auto">auto - 沿用现有逻辑（默认）</option>
        <option value="html">html - 静态抓取</option>
        <option value="js">js - 动态渲染</option>
        <option value="stealth">stealth - 隐蔽抓取</option>
      </select>
    </div>
    <div class="field">
      <label>正文容器选择器</label>
      <textarea id="fContentSelector" placeholder="例如：article 或 div.article-body；多个选择器请每行一个"></textarea>
    </div>
    <div class="field"><label>备注</label><textarea id="fNote" placeholder="可选"></textarea></div>
    <div class="selectors-preview" id="selectorsPreview"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" id="btnRulePreview" onclick="previewRules()" style="display:none">规则预览</button>
      <button class="btn btn-ai btn-sm" id="btnAnalyze" onclick="analyzeSite()" style="margin-right:auto;display:none">AI分析</button>
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="btnSave" onclick="saveSite()">保存</button>
    </div>
  </div>
</div>

<script>
let editingId = null;
let pollTimer = null;
let crawlPollTimer = null;
let analyzePollTimer = null;
let modalInitialState = '';
let modalBackdropPointerDown = false;
let _dataDirTimer = null;
let _analyzeSourceId = null;
let _analyzeFromModal = false;
let systemState = {
  scheduler_on: true,
  interval_hours: 1,
  last_run: null,
  crawl_running: false,
  crawl_stopped: false,
};

const STATUS_LABEL = {
  rss: 'RSS',
  no_rss: '无 RSS',
  pending: '待检测',
  timeout: '超时',
  error: '错误',
  checking: '检测中',
};

const MODE_LABEL = {
  auto: 'AUTO',
  html: 'HTML',
  js: 'JS',
  stealth: 'STEALTH',
};

function updateStatusBar(task, progress, target = '') {
  document.getElementById('statusTask').textContent = task;
  document.getElementById('statusTarget').textContent = target;
  const dot = document.getElementById('statusDot');
  const prog = document.getElementById('statusProgress');
  const fill = document.getElementById('statusFill');
  if (progress != null) {
    dot.classList.add('busy');
    prog.classList.add('active');
    fill.style.width = progress + '%';
  } else if (task.includes('完成') || task.includes('就绪') || task.includes('已启动') || task.includes('已停止')) {
    dot.classList.remove('busy');
    prog.classList.remove('active');
    fill.style.width = '0%';
  } else {
    dot.classList.add('busy');
    prog.classList.remove('active');
  }
}

function setServiceToggle(enabled) {
  const btn = document.getElementById('btnServiceToggle');
  btn.textContent = enabled ? '停止' : '启动';
  btn.classList.toggle('btn-primary', !enabled);
  btn.classList.toggle('btn-danger', enabled);
}

function showIdleStatus() {
  const interval = document.getElementById('intervalSelect').value;
  if (!systemState.scheduler_on) {
    updateStatusBar('抓取已停止', null, '点击启动恢复定时抓取');
    return;
  }
  updateStatusBar('定时抓取已启动', null, '间隔 ' + interval + ' 小时');
}

function openHistoryDrawer() {
  document.getElementById('historyDrawer').classList.add('open');
  document.getElementById('historyBackdrop').classList.add('open');
}

function closeHistoryDrawer() {
  document.getElementById('historyDrawer').classList.remove('open');
  document.getElementById('historyBackdrop').classList.remove('open');
}

function getContentSelectorValue() {
  const raw = document.getElementById('fContentSelector').value.trim();
  if (!raw) return '';
  const lines = raw.split(/\r?\n/).map(item => item.trim()).filter(Boolean);
  return lines.length > 1 ? lines : lines[0];
}

function serializeModalForm() {
  return JSON.stringify({
    name: document.getElementById('fName').value.trim(),
    url: document.getElementById('fUrl').value.trim(),
    note: document.getElementById('fNote').value.trim(),
    crawl_mode: document.getElementById('fCrawlMode').value,
    article_crawl_mode: document.getElementById('fArticleCrawlMode').value,
    content_selector: getContentSelectorValue(),
  });
}

function hasUnsavedModalChanges() {
  return document.getElementById('overlay').classList.contains('open') && serializeModalForm() !== modalInitialState;
}

function confirmDiscardModalChanges() {
  return !hasUnsavedModalChanges() || confirm('表单内容尚未保存，确定关闭？');
}

function captureModalState() {
  modalInitialState = serializeModalForm();
}

function trackModalBackdropPointerDown(e) {
  modalBackdropPointerDown = e.target === document.getElementById('overlay');
}

function resetModalBackdropPointerState() {
  modalBackdropPointerDown = false;
}

function esc(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function loadDashboardStats() {
  try {
    const res = await fetch('/api/system/stats');
    if (!res.ok) return;
    const stats = await res.json();
    document.getElementById('statsMonthCount').textContent = String(stats.month_count || 0);
    document.getElementById('statsWeekCount').textContent = String(stats.week_count || 0);
    document.getElementById('statsDayCount').textContent = String(stats.day_count || 0);
  } catch (e) {}
}

async function fetchJson(url, options = {}, timeoutMs = 10000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    const data = await res.json().catch(() => ({}));
    return { res, data };
  } finally {
    clearTimeout(timer);
  }
}

async function loadSystemStatus() {
  const { res, data } = await fetchJson('/api/system/status');
  if (!res.ok) throw new Error('系统状态读取失败');
  systemState = data;
  setServiceToggle(systemState.scheduler_on);
  if (systemState.crawl_running) {
    startCrawlPolling();
    return;
  }
  showIdleStatus();
}

async function loadSitesWithCrawlInfo() {
  const { res, data: sites } = await fetchJson('/api/sites');
  if (!res.ok || !Array.isArray(sites)) throw new Error('站点列表读取失败');
  renderTable(sites);
  document.getElementById('siteCount').textContent = sites.length + ' 个网站';
  try {
    const summaryResult = await fetchJson('/api/results/summary');
    if (summaryResult.res.ok && summaryResult.data && typeof summaryResult.data === 'object') {
      sites.forEach(s => {
        const latest = summaryResult.data[s.id];
        if (latest) {
          s.crawl_count = latest.count;
          s.last_crawled = latest.crawled_at;
        }
      });
    }
  } catch (e) {}
  renderTable(sites);
  document.getElementById('siteCount').textContent = sites.length + ' 个网站';
  await loadDashboardStats();
}

async function loadSites() {
  const res = await fetch('/api/sites');
  const sites = await res.json();
  renderTable(sites);
  document.getElementById('siteCount').textContent = sites.length + ' 个网站';
}

function renderTable(sites) {
  const tbody = document.getElementById('tbody');
  if (sites.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10"><div class="empty">还没有网站，点击右上角添加</div></td></tr>';
    return;
  }
  tbody.innerHTML = sites.map(s => {
    const mode = s.crawl_mode || 'auto';
    const paused = Boolean(s.crawl_paused);
    const pauseBtnClass = paused ? 'btn btn-primary btn-sm' : 'btn btn-warning btn-sm';
    const pauseBtnLabel = paused ? '恢复抓取' : '停止抓取';
    return `
    <tr id="row-${s.id}">
      <td style="color:#999;font-size:12px;text-align:center">${s.seq || '—'}</td>
      <td>${esc(s.name)}</td>
      <td class="url-cell"><a href="${esc(s.url)}" target="_blank">${esc(s.url)}</a></td>
      <td class="url-cell">${s.rss_url ? `<a href="${esc(s.rss_url)}" target="_blank">${esc(s.rss_url)}</a>` : '<span style="color:#ccc">—</span>'}</td>
      <td><span class="badge badge-${esc(s.status)}">${STATUS_LABEL[s.status] || esc(s.status)}</span></td>
      <td>
        <div class="mode-stack">
          <span class="badge badge-${esc(mode)}">${MODE_LABEL[mode] || esc(mode)}</span>
          ${paused ? '<span class="badge badge-paused">已暂停</span>' : ''}
        </div>
      </td>
      <td style="color:#999;font-size:12px">${s.last_checked ? s.last_checked.replace('T', ' ') : '—'}</td>
      <td style="color:#999;font-size:12px">${s.crawl_count != null ? s.crawl_count : '—'}</td>
      <td style="color:#999;font-size:12px">${s.last_crawled ? s.last_crawled.replace('T', ' ') : '—'}</td>
      <td>
        <div class="actions-stack">
          <div class="actions actions-primary">
            <button class="btn btn-secondary btn-sm" data-action="check" onclick="checkOne('${s.id}')">检测</button>
            <button class="btn btn-secondary btn-sm" data-action="crawl" onclick="crawlOne('${s.id}')" ${paused ? 'disabled' : ''}>抓取</button>
            <button class="btn btn-secondary btn-sm" data-action="output-test" onclick="testSiteOutput('${s.id}')">输出测试</button>
            <button class="${pauseBtnClass}" data-action="pause" onclick="toggleSiteCrawl('${s.id}', ${paused})">${pauseBtnLabel}</button>
          </div>
          <div class="actions actions-secondary">
            <button class="btn btn-secondary btn-sm" onclick="showHistory('${s.id}', '${esc(s.name)}')">历史</button>
            <button class="btn btn-secondary btn-sm" onclick="openModal('${s.id}')">编辑</button>
            <button class="btn btn-danger btn-sm" onclick="deleteSite('${s.id}')">删除</button>
            <span class="btn btn-secondary btn-sm action-placeholder">占位</span>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function checkOne(id) {
  const row = document.getElementById('row-' + id);
  const btn = row.querySelector('[data-action="check"]');
  const badge = row.querySelector('.badge');
  btn.disabled = true;
  badge.className = 'badge badge-checking';
  badge.textContent = '检测中';
  const res = await fetch('/api/check/' + id, { method: 'POST' });
  if (!res.ok) {
    alert('检测失败');
  }
  btn.disabled = false;
  loadSites();
}

async function crawlOne(id) {
  const row = document.getElementById('row-' + id);
  const btn = row.querySelector('[data-action="crawl"]');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.textContent = '抓取中';
  try {
    const res = await fetch('/api/crawl/' + id, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error || '抓取失败');
    }
  } finally {
    btn.disabled = false;
    btn.textContent = '抓取';
    loadSitesWithCrawlInfo();
  }
}

async function testSiteOutput(id) {
  const row = document.getElementById('row-' + id);
  const btn = row ? row.querySelector('[data-action="output-test"]') : null;
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.textContent = '测试中';
  updateStatusBar('输出测试中', null, '正在抓取并生成桌面报告');
  try {
    const res = await fetch('/api/sites/' + id + '/output-test', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      alert((data.error || '输出测试失败') + (data.report_path ? '\n报告：' + data.report_path : ''));
      updateStatusBar('输出测试失败', null, data.error || '');
      return;
    }
    alert(
      '测试完成，已输出到桌面：\n' + data.report_path +
      '\n\n文章数：' + data.count +
      '\n有正文：' + data.content_count
    );
    updateStatusBar('输出测试完成', null, data.report_path);
  } catch (e) {
    alert('输出测试失败：' + e.message);
    updateStatusBar('输出测试失败', null, e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '输出测试';
  }
}

async function toggleSiteCrawl(id, paused) {
  const res = await fetch('/api/sites/' + id + '/crawl-toggle', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ paused: !paused }),
  });
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || '更新失败');
    return;
  }
  loadSitesWithCrawlInfo();
}

function startCrawlPolling() {
  if (crawlPollTimer) return;
  updateStatusBar('抓取中', 0, '准备开始');
  crawlPollTimer = setInterval(async () => {
    const res = await fetch('/api/crawl/status');
    const s = await res.json();
    systemState.crawl_running = s.running;
    systemState.crawl_stopped = s.stopped;
    if (s.total > 0) {
      const pct = Math.round((s.done / s.total) * 100);
      updateStatusBar(s.stopped && s.running ? '停止中' : '抓取中', pct, s.done + '/' + s.total + (s.current ? '，' + s.current : ''));
    }
    if (!s.running) {
      clearInterval(crawlPollTimer);
      crawlPollTimer = null;
      const btn = document.getElementById('btnCrawlAll');
      btn.disabled = false;
      btn.textContent = '全部抓取';
      await loadSitesWithCrawlInfo();
      await loadSystemStatus();
      if (s.stopped) {
        updateStatusBar('抓取已停止', null, '服务器已停止继续抓取剩余网站');
      }
    }
  }, 1500);
}

async function showHistory(siteId, siteName) {
  document.getElementById('historyTitle').textContent = siteName + ' - 抓取历史';
  document.getElementById('articleList').style.display = 'none';
  document.getElementById('articleList').innerHTML = '';
  openHistoryDrawer();
  const res = await fetch('/api/results/' + siteId);
  const results = await res.json();
  const list = document.getElementById('historyList');
  if (results.length === 0) {
    list.innerHTML = '<li style="color:#999">暂无抓取记录</li>';
    return;
  }
  list.innerHTML = results.map(r => `
    <li data-site-id="${esc(siteId)}" data-filename="${esc(r.filename)}" class="history-item">
      <span style="color:#999">${r.crawled_at.replace('T', ' ')}</span>
      <span>${r.count} 条</span>
      <span class="badge badge-${r.method === 'rss' ? 'rss' : 'no_rss'}">${r.method.toUpperCase()}</span>
    </li>
  `).join('');
  document.querySelectorAll('#historyList .history-item').forEach(li => {
    li.addEventListener('click', function() {
      showArticles(this.dataset.siteId, this.dataset.filename, this);
    });
  });
}

async function showArticles(siteId, filename, liEl) {
  const articleDiv = document.getElementById('articleList');
  if (liEl.classList.contains('active')) {
    liEl.classList.remove('active');
    articleDiv.style.display = 'none';
    return;
  }
  document.querySelectorAll('#historyList li').forEach(l => l.classList.remove('active'));
  liEl.classList.add('active');
  const res = await fetch('/api/results/' + siteId + '/' + filename);
  const data = await res.json();
  const items = data.items || [];
  articleDiv.style.display = 'block';
  articleDiv.innerHTML = items.map(item => {
    const content = item.content ? `<div class="article-content">${esc(item.content)}</div>` : '';
    const published = item.published ? `<div class="article-meta">${esc(String(item.published).replace('T', ' '))}</div>` : '';
    return `
      <div class="article-item">
        <a class="article-title" href="${esc(item.url)}" target="_blank">${esc(item.title)}</a>
        ${published}
        ${content}
      </div>
    `;
  }).join('');
}

async function initIntervalSelect() {
  const { res, data: cfg } = await fetchJson('/api/config');
  if (!res.ok) throw new Error('配置读取失败');
  const sel = document.getElementById('intervalSelect');
  const interval = Number(cfg.crawl_interval_hours || 1);
  sel.value = String(Math.min(Math.max(interval, 1), 12));
  sel.addEventListener('change', async () => {
    await fetch('/api/config', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ crawl_interval_hours: parseInt(sel.value) })
    });
    systemState.interval_hours = parseInt(sel.value);
    showIdleStatus();
  });
  document.getElementById('dataDirInput').value = cfg.data_dir || '';
  document.getElementById('bookmarkHtmlInput').value = cfg.bookmark_html_path || 'D:\\科情\\科情\\科情.html';
  const ageSel = document.getElementById('ageSelect');
  ageSel.value = String(cfg.max_article_age_days || 0);
  ageSel.addEventListener('change', async () => {
    await fetch('/api/config', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ max_article_age_days: parseInt(ageSel.value) })
    });
  });
}

function openModal(id) {
  resetModalBackdropPointerState();
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? '编辑网站' : '添加网站';
  const btnAnalyze = document.getElementById('btnAnalyze');
  const btnRulePreview = document.getElementById('btnRulePreview');
  const preview = document.getElementById('selectorsPreview');
  preview.classList.remove('active');
  preview.textContent = '';
  if (id) {
    btnAnalyze.style.display = '';
    btnRulePreview.style.display = '';
    fetch('/api/sites').then(r => r.json()).then(sites => {
      const s = sites.find(x => x.id === id);
      if (!s) return;
      document.getElementById('fName').value = s.name;
      document.getElementById('fUrl').value = s.url;
      document.getElementById('fNote').value = s.note || '';
      document.getElementById('fCrawlMode').value = s.crawl_mode || 'auto';
      document.getElementById('fArticleCrawlMode').value = s.article_crawl_mode || 'auto';
      document.getElementById('fContentSelector').value = Array.isArray(s.content_selector)
        ? s.content_selector.join('\n')
        : (s.content_selector || '');
      if (s.selectors && s.selectors.css_selector) {
        preview.textContent = JSON.stringify(s.selectors, null, 2);
        preview.classList.add('active');
      }
      captureModalState();
    });
  } else {
    btnAnalyze.style.display = 'none';
    btnRulePreview.style.display = 'none';
    document.getElementById('fName').value = '';
    document.getElementById('fUrl').value = '';
    document.getElementById('fNote').value = '';
    document.getElementById('fCrawlMode').value = 'auto';
    document.getElementById('fArticleCrawlMode').value = 'auto';
    document.getElementById('fContentSelector').value = '';
    captureModalState();
  }
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('fName').focus(), 50);
}

function closeModal(force = false) {
  if (!force && !confirmDiscardModalChanges()) return;
  resetModalBackdropPointerState();
  document.getElementById('overlay').classList.remove('open');
}

function closeModalOnBg(e) {
  const overlay = document.getElementById('overlay');
  const shouldClose = modalBackdropPointerDown && e.target === overlay && e.currentTarget === overlay;
  resetModalBackdropPointerState();
  if (shouldClose) closeModal();
}

async function saveSite() {
  const name = document.getElementById('fName').value.trim();
  const url = document.getElementById('fUrl').value.trim();
  const note = document.getElementById('fNote').value.trim();
  const crawl_mode = document.getElementById('fCrawlMode').value;
  const article_crawl_mode = document.getElementById('fArticleCrawlMode').value;
  const content_selector = getContentSelectorValue();
  if (!name || !url) { alert('名称和 URL 不能为空'); return; }
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  const body = JSON.stringify({
    name, url, note, crawl_mode, article_crawl_mode, content_selector,
  });
  if (editingId) {
    await fetch('/api/sites/' + editingId, { method: 'PUT', headers: {'Content-Type':'application/json'}, body });
  } else {
    await fetch('/api/sites', { method: 'POST', headers: {'Content-Type':'application/json'}, body });
  }
  btn.disabled = false;
  closeModal(true);
  loadSitesWithCrawlInfo();
}

async function previewRules() {
  if (!editingId) return;
  const btn = document.getElementById('btnRulePreview');
  const preview = document.getElementById('selectorsPreview');
  btn.disabled = true;
  btn.textContent = '测试中';
  try {
    const res = await fetch('/api/sites/' + editingId + '/rule-preview', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        content_selector: getContentSelectorValue(),
        article_crawl_mode: document.getElementById('fArticleCrawlMode').value,
        limit: 3,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error || '规则预览失败');
      return;
    }
    const lines = [
      '列表模式: ' + data.listing_method,
      '详情模式: ' + data.article_crawl_mode,
      '正文选择器: ' + (data.content_selector || '未设置'),
      '文章数: ' + data.count,
      '',
    ];
    (data.items || []).forEach(item => {
      lines.push(
        (item.content_selector_hit ? '[选择器命中] ' : '[选择器未命中] ') +
        (item.content_hit ? '' : '[无正文] ') +
        item.content_length + ' 字 - ' + item.title
      );
    });
    preview.textContent = lines.join('\n');
    preview.classList.add('active');
  } finally {
    btn.disabled = false;
    btn.textContent = '规则预览';
  }
}

document.getElementById('btnServiceToggle').addEventListener('click', async () => {
  const btn = document.getElementById('btnServiceToggle');
  const dataDirInput = document.getElementById('dataDirInput');
  btn.disabled = true;
  try {
    if (!systemState.scheduler_on) {
      dataDirInput.classList.remove('error');
      const checkRes = await fetch('/api/config/data-dir-check', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ data_dir: dataDirInput.value.trim() })
      });
      const checkData = await checkRes.json();
      if (!checkRes.ok || !checkData.valid) {
        dataDirInput.classList.add('error');
        dataDirInput.focus();
        alert(
          '无法启动定时抓取：' +
          (checkData.error || 'JSON 输出路径不可用') +
          '\n\n请填写可用的 JSON 输出路径后重试。'
        );
        return;
      }

      const saveRes = await fetch('/api/config', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ data_dir: dataDirInput.value.trim() })
      });
      if (!saveRes.ok) {
        const saveData = await saveRes.json();
        dataDirInput.classList.add('error');
        alert(saveData.error || 'JSON 输出路径保存失败');
        return;
      }
      dataDirInput.classList.remove('error');
    }

    const res = await fetch('/api/system/crawl-service', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ enabled: !systemState.scheduler_on })
    });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error || '操作失败');
      return;
    }
    await loadSystemStatus();
    if (!systemState.scheduler_on) {
      await fetch('/api/crawl/stop', { method: 'POST' });
    }
  } catch (e) {
    alert('无法检查 JSON 输出路径，请确认服务器正在运行。');
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('btnCheckAll').addEventListener('click', async () => {
  const btn = document.getElementById('btnCheckAll');
  btn.disabled = true;
  btn.textContent = '检测中';
  await fetch('/api/check', { method: 'POST' });
  startPolling();
});

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    const res = await fetch('/api/check/status');
    const s = await res.json();
    const pct = s.total > 0 ? Math.round(s.done / s.total * 100) : 0;
    updateStatusBar('检测中', pct, s.done + '/' + s.total + (s.current ? '，' + s.current : ''));
    loadSites();
    if (!s.running) {
      clearInterval(pollTimer);
      pollTimer = null;
      document.getElementById('btnCheckAll').disabled = false;
      document.getElementById('btnCheckAll').textContent = '全部检测';
      showIdleStatus();
    }
  }, 1500);
}

document.getElementById('btnSaveDataDir').addEventListener('click', async () => {
  const input = document.getElementById('dataDirInput');
  const btn = document.getElementById('btnSaveDataDir');
  clearTimeout(_dataDirTimer);
  btn.disabled = true;
  btn.textContent = '保存路径';
  input.classList.remove('saved', 'error');
  try {
    const res = await fetch('/api/config', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ data_dir: input.value.trim() })
    });
    const data = await res.json();
    if (!res.ok) {
      input.classList.add('error');
      btn.textContent = '路径无效';
      alert(data.error || 'JSON 输出路径保存失败');
      _dataDirTimer = setTimeout(() => {
        input.classList.remove('error');
        btn.textContent = '保存路径';
      }, 3000);
      return;
    }
    input.value = data.data_dir || '';
    input.classList.add('saved');
    btn.textContent = '已保存';
    _dataDirTimer = setTimeout(() => {
      input.classList.remove('saved');
      btn.textContent = '保存路径';
    }, 3000);
  } catch (e) {
    input.classList.add('error');
    btn.textContent = '保存失败';
    alert('JSON 输出路径保存失败，请确认服务器正在运行。');
    _dataDirTimer = setTimeout(() => {
      input.classList.remove('error');
      btn.textContent = '保存路径';
    }, 3000);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('btnImportBookmarks').addEventListener('click', async () => {
  const input = document.getElementById('bookmarkHtmlInput');
  const btn = document.getElementById('btnImportBookmarks');
  btn.disabled = true;
  btn.textContent = '导入中';
  try {
    const res = await fetch('/api/import/bookmarks', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ path: input.value.trim() })
    });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error || '导入失败');
      return;
    }
    alert(`已导入 ${data.imported || 0} 个站点，跳过 ${data.skipped || 0} 个重复项`);
    loadSitesWithCrawlInfo();
  } finally {
    btn.disabled = false;
    btn.textContent = '导入书签';
  }
});

document.getElementById('btnCrawlAll').addEventListener('click', async () => {
  const btn = document.getElementById('btnCrawlAll');
  btn.disabled = true;
  btn.textContent = '抓取中';
  const res = await fetch('/api/crawl', { method: 'POST' });
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || '抓取失败');
    btn.disabled = false;
    btn.textContent = '全部抓取';
    return;
  }
  startCrawlPolling();
});

async function deleteSite(id) {
  if (!confirm('确认删除？')) return;
  await fetch('/api/sites/' + id, { method: 'DELETE' });
  loadSites();
}

async function analyzeSite() {
  if (!editingId) return;
  await _doAnalyze(editingId);
}

async function _doAnalyze(siteId) {
  const btnModal = document.getElementById('btnAnalyze');
  _analyzeFromModal = document.getElementById('overlay').classList.contains('open');
  _analyzeSourceId = siteId;
  if (_analyzeFromModal && btnModal) {
    btnModal.disabled = true;
    btnModal.textContent = '分析中';
  }
  try {
    const res = await fetch('/api/sites/' + siteId + '/analyze', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error || '分析失败');
      _restoreAnalyzeButtons();
      return;
    }
    startAnalyzePolling();
  } catch (e) {
    alert('请求失败: ' + e.message);
    _restoreAnalyzeButtons();
  }
}

function _restoreAnalyzeButtons() {
  const btnModal = document.getElementById('btnAnalyze');
  if (btnModal) { btnModal.disabled = false; btnModal.textContent = 'AI分析'; }
  _analyzeSourceId = null;
  _analyzeFromModal = false;
}

function startAnalyzePolling() {
  if (analyzePollTimer) return;
  analyzePollTimer = setInterval(async () => {
    const res = await fetch('/api/analyze/status');
    const s = await res.json();
    if (s.running) {
      updateStatusBar('AI分析中', null, s.message);
      return;
    }
    clearInterval(analyzePollTimer);
    analyzePollTimer = null;
    if (s.step === 'done') {
      updateStatusBar('AI分析完成', null, '可查看选择器预览');
      const rr = await fetch('/api/analyze/result');
      const result = await rr.json();
      if (result && result.selectors) {
        const preview = document.getElementById('selectorsPreview');
        if (_analyzeFromModal && preview && document.getElementById('overlay').classList.contains('open')) {
          let text = JSON.stringify(result.selectors, null, 2);
          text += '\n\n预览: ' + result.preview_count + ' 条';
          if (result.preview && result.preview.length > 0) {
            text += '\n' + result.preview.map(p => '  ' + p.title + (p.published ? ' [' + p.published + ']' : '')).join('\n');
          }
          preview.textContent = text;
          preview.classList.add('active');
        }
      }
      _restoreAnalyzeButtons();
      loadSitesWithCrawlInfo();
      setTimeout(showIdleStatus, 3000);
    } else if (s.step === 'error') {
      updateStatusBar('AI分析异常', null, s.message);
      _restoreAnalyzeButtons();
      setTimeout(showIdleStatus, 5000);
    }
  }, 1500);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('overlay').classList.contains('open')) {
    closeModal();
  }
});

document.addEventListener('pointerup', resetModalBackdropPointerState);
document.addEventListener('pointercancel', resetModalBackdropPointerState);

loadSitesWithCrawlInfo().catch(() => {
  updateStatusBar('页面加载异常', null, '请检查服务器连接后刷新');
});
initIntervalSelect().catch(() => {});
loadSystemStatus().catch(() => {
  updateStatusBar('状态读取失败', null, '请检查服务器连接后刷新');
});
</script>
