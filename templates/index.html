<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMonitor 管理</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; }
  .header { background: #fff; border-bottom: 1px solid #e5e5e5; padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 56px; }
  .header h1 { font-size: 16px; font-weight: 600; flex: 1; }
  .btn { padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: #1a1a1a; color: #fff; }
  .btn-secondary { background: #fff; color: #1a1a1a; border: 1px solid #d4d4d4; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .main { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
  .card { background: #fff; border-radius: 8px; border: 1px solid #e5e5e5; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #fafafa; padding: 10px 14px; text-align: left; font-weight: 500; color: #666; border-bottom: 1px solid #e5e5e5; white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
  .badge-rss { background: #dcfce7; color: #16a34a; }
  .badge-no_rss { background: #fef9c3; color: #a16207; }
  .badge-pending { background: #f3f4f6; color: #6b7280; }
  .badge-timeout { background: #fee2e2; color: #dc2626; }
  .badge-error { background: #fee2e2; color: #dc2626; }
  .badge-checking { background: #dbeafe; color: #2563eb; }
  .url-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .url-cell a { color: #2563eb; text-decoration: none; }
  .url-cell a:hover { text-decoration: underline; }
  .actions { display: flex; gap: 6px; }
  .progress-bar { height: 3px; background: #e5e5e5; border-radius: 2px; overflow: hidden; margin-bottom: 16px; display: none; }
  .progress-bar.active { display: block; }
  .progress-fill { height: 100%; background: #1a1a1a; transition: width .3s; }
  .progress-text { font-size: 12px; color: #666; margin-bottom: 8px; display: none; }
  .progress-text.active { display: block; }
  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 100; }
  .overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 10px; padding: 24px; width: 420px; max-width: 95vw; }
  .modal h2 { font-size: 15px; font-weight: 600; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: #555; margin-bottom: 5px; }
  .field input, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid #d4d4d4; border-radius: 6px; font-size: 13px; outline: none; }
  .field input:focus, .field textarea:focus { border-color: #1a1a1a; }
  .field textarea { resize: vertical; min-height: 60px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .empty { text-align: center; padding: 48px; color: #999; font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <h1>OpenMonitor</h1>
  <span id="siteCount" style="font-size:12px;color:#999;"></span>
  <button class="btn btn-secondary" id="btnCheckAll">全部检测</button>
  <button class="btn btn-primary" onclick="openModal()">+ 添加网站</button>
</div>

<div class="main">
  <div class="progress-text" id="progressText"></div>
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="card">
    <table id="siteTable">
      <thead>
        <tr>
          <th>名称</th>
          <th>URL</th>
          <th>RSS 地址</th>
          <th>状态</th>
          <th>最后检测</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- 添加/编辑弹窗 -->
<div class="overlay" id="overlay" onclick="closeModalOnBg(event)">
  <div class="modal">
    <h2 id="modalTitle">添加网站</h2>
    <div class="field"><label>名称 *</label><input id="fName" placeholder="例：新华网"></div>
    <div class="field"><label>URL *</label><input id="fUrl" placeholder="https://example.com"></div>
    <div class="field"><label>备注</label><textarea id="fNote" placeholder="可选"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="btnSave" onclick="saveSite()">保存</button>
    </div>
  </div>
</div>

<script>
let editingId = null;
let pollTimer = null;

const STATUS_LABEL = {
  rss: 'RSS',
  no_rss: '无RSS',
  pending: '待检测',
  timeout: '超时',
  error: '出错',
  checking: '检测中…',
};

async function loadSites() {
  const res = await fetch('/api/sites');
  const sites = await res.json();
  renderTable(sites);
  document.getElementById('siteCount').textContent = sites.length + ' 个网站';
}

function renderTable(sites) {
  const tbody = document.getElementById('tbody');
  if (sites.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty">还没有网站，点击右上角添加</div></td></tr>';
    return;
  }
  tbody.innerHTML = sites.map(s => `
    <tr id="row-${s.id}">
      <td>${esc(s.name)}</td>
      <td class="url-cell"><a href="${esc(s.url)}" target="_blank">${esc(s.url)}</a></td>
      <td class="url-cell">${s.rss_url ? `<a href="${esc(s.rss_url)}" target="_blank">${esc(s.rss_url)}</a>` : '<span style="color:#ccc">—</span>'}</td>
      <td><span class="badge badge-${s.status}">${STATUS_LABEL[s.status] || s.status}</span></td>
      <td style="color:#999;font-size:12px">${s.last_checked ? s.last_checked.replace('T', ' ') : '—'}</td>
      <td class="actions">
        <button class="btn btn-secondary btn-sm" onclick="checkOne('${s.id}')">检测</button>
        <button class="btn btn-secondary btn-sm" onclick="openModal('${s.id}')">编辑</button>
        <button class="btn btn-danger btn-sm" onclick="deleteSite('${s.id}')">删除</button>
      </td>
    </tr>
  `).join('');
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function checkOne(id) {
  const row = document.getElementById('row-' + id);
  const btn = row.querySelector('button');
  btn.disabled = true;
  row.querySelector('.badge').className = 'badge badge-checking';
  row.querySelector('.badge').textContent = '检测中…';
  const res = await fetch('/api/check/' + id, { method: 'POST' });
  const site = await res.json();
  btn.disabled = false;
  loadSites();
}

async function deleteSite(id) {
  if (!confirm('确认删除？')) return;
  await fetch('/api/sites/' + id, { method: 'DELETE' });
  loadSites();
}

function openModal(id) {
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? '编辑网站' : '添加网站';
  if (id) {
    fetch('/api/sites').then(r => r.json()).then(sites => {
      const s = sites.find(x => x.id === id);
      if (!s) return;
      document.getElementById('fName').value = s.name;
      document.getElementById('fUrl').value = s.url;
      document.getElementById('fNote').value = s.note || '';
    });
  } else {
    document.getElementById('fName').value = '';
    document.getElementById('fUrl').value = '';
    document.getElementById('fNote').value = '';
  }
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('fName').focus(), 50);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}

function closeModalOnBg(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}

async function saveSite() {
  const name = document.getElementById('fName').value.trim();
  const url = document.getElementById('fUrl').value.trim();
  const note = document.getElementById('fNote').value.trim();
  if (!name || !url) { alert('名称和URL不能为空'); return; }
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  const body = JSON.stringify({ name, url, note });
  if (editingId) {
    await fetch('/api/sites/' + editingId, { method: 'PUT', headers: {'Content-Type':'application/json'}, body });
  } else {
    await fetch('/api/sites', { method: 'POST', headers: {'Content-Type':'application/json'}, body });
  }
  btn.disabled = false;
  closeModal();
  loadSites();
}

document.getElementById('btnCheckAll').addEventListener('click', async () => {
  const btn = document.getElementById('btnCheckAll');
  btn.disabled = true;
  btn.textContent = '检测中…';
  await fetch('/api/check', { method: 'POST' });
  startPolling();
});

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    const res = await fetch('/api/check/status');
    const s = await res.json();
    const pct = s.total > 0 ? Math.round(s.done / s.total * 100) : 0;
    document.getElementById('progressBar').classList.toggle('active', s.running);
    document.getElementById('progressText').classList.toggle('active', s.running);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `检测中 ${s.done}/${s.total}：${s.current}`;
    loadSites();
    if (!s.running) {
      clearInterval(pollTimer);
      pollTimer = null;
      document.getElementById('btnCheckAll').disabled = false;
      document.getElementById('btnCheckAll').textContent = '全部检测';
      document.getElementById('progressBar').classList.remove('active');
      document.getElementById('progressText').classList.remove('active');
    }
  }, 1500);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('overlay').classList.contains('open')) saveSite();
  if (e.key === 'Escape') closeModal();
});

loadSites();
</script>
</body>
</html>
